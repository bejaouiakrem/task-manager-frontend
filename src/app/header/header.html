<!-- Header Component - Dark Corporate Theme -->
<header class="navbar">
  <div class="container">
    <!-- Logo/Brand -->
    <a class="navbar-brand" routerLink="/dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
        <path d="M13.5 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h11zm-11-1a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2h-11z"/>
        <path d="M6.5 3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V3zm-4 0a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V3zm8 0a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V3z"/>
      </svg>
      <span>TaskFlow</span>
    </a>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <ng-container *ngIf="isLoggedIn">
        <!-- Dashboard Button -->
        <a routerLink="/dashboard" class="nav-btn nav-btn-secondary">
          <i class="bi bi-kanban"></i>
          <span>Dashboard</span>
        </a>

        <!-- Role-based Navigation -->
        <ng-container *ngIf="userRole === 'ADMIN'">
          <a routerLink="/manage-users" class="nav-btn nav-btn-secondary">
            <i class="bi bi-people"></i>
            <span>Manage Users</span>
          </a>
          <a routerLink="/manage-project" class="nav-btn nav-btn-secondary">
            <i class="bi bi-folder"></i>
            <span>Manage Projects</span>
          </a>
        </ng-container>

        <ng-container *ngIf="userRole === 'PROJECT_MANAGER' || userRole === 'USER'">
          <a routerLink="/manage-project" class="nav-btn nav-btn-secondary">
            <i class="bi bi-folder"></i>
            <span>Manage Projects</span>
          </a>
        </ng-container>
      </ng-container>

      <!-- Login/Signup for non-authenticated users -->
      <ng-template [ngIf]="!isLoggedIn">
        <a routerLink="/login" class="nav-btn nav-btn-secondary">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Login</span>
        </a>
        <a routerLink="/signup" class="nav-btn nav-btn-primary">
          <i class="bi bi-person-plus"></i>
          <span>Sign Up</span>
        </a>
      </ng-template>

      <!-- User Dropdown -->
      <ng-container *ngIf="isLoggedIn">
        <div class="user-dropdown">
          <button class="dropdown-toggle" type="button" (click)="toggleDropdown()">
            <div class="user-avatar">
              <div class="initials">{{ username | initials }}</div>
              <span>{{ username }}</span>
            </div>
          </button>
          
          <div class="dropdown-menu" [class.show]="dropdownOpen">
            <a class="dropdown-item" routerLink="/profile" (click)="closeDropdown()">
              <i class="bi bi-person"></i>
              <span>Profile</span>
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" (click)="signOut(); closeDropdown()">
              <i class="bi bi-box-arrow-right"></i>
              <span>Sign Out</span>
            </a>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
